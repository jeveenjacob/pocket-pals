<body>
<main class="app">
  <header><div class="brand">Pocket <span>Pals!</span></div><div class="tag">✨ Happy pets, happy hearts</div></header>
  <section id="setup" class="panel setup">
    <div>
      <h1>Choose your new <em>best buddy!</em></h1>
      <p class="lead">Pick a pet, choose their favorite color, and give your tiny friend a name.</p>
      <div id="petChoices" class="pet-grid" aria-label="Choose a pet"></div>
      <h2>Pick a color</h2><div id="colors" class="colors" aria-label="Choose a color"></div>
      <div class="name-row"><input id="petName" maxlength="12" value="Bubbles" aria-label="Pet name"><button id="start" class="start">Let's play! →</button></div>
    </div>
    <div class="preview"><div id="previewPet"></div></div>
  </section>
  <section id="game" class="panel game hidden">
    <div id="room" class="room"><div id="speech" class="speech">Hi! I already love you! 💕</div><div id="gamePet"></div></div>
    <aside>
      <h1 style="font-size:2.7rem"><span id="titleName">Bubbles</span>' day</h1>
      <p class="lead">Keep every meter full to make your pal sparkle!</p>
      <div class="stats">
        <div class="stat">🍎 Full<div class="stat-line hunger"><i id="hungerBar"></i></div></div>
        <div class="stat">🧼 Clean<div class="stat-line clean"><i id="cleanBar"></i></div></div>
        <div class="stat">🌙 Rested<div class="stat-line energy"><i id="energyBar"></i></div></div>
      </div>
      <div class="actions">
        <button class="action feed" data-action="feed">🥕 Feed me</button><button class="action bath" data-action="bath">🛁 Bath time</button>
        <button class="action sleep" data-action="sleep">🌙 Go to sleep</button><button class="action chat" data-action="chat">💬 Let's chat</button>
        <button class="action teach" data-action="teach">🎓 Teach me something!</button>
        <div id="catControls" class="cat-controls hidden"><button type="button" id="walkCat" class="action walk">🐾 Walk around</button><button type="button" id="throwWool" class="action wool-btn">🧶 Throw the wool</button></div>
        <div id="dogControls" class="dog-controls hidden"><button type="button" id="walkDog" class="action dog-walk">🐕 Wander around</button><button type="button" id="throwStick" class="action stick-btn">🪵 Throw the stick</button></div>
        <div id="birdControls" class="bird-controls hidden"><button type="button" id="flyBird" class="action fly-btn">🪽 Fly around</button><button type="button" id="birdFetch" class="action bird-fetch-btn">🍃 Throw something</button></div>
        <div id="bunnyControls" class="bunny-controls hidden"><button type="button" id="hopBunny" class="action hop-btn">🐇 Hop around</button><button type="button" id="throwCarrot" class="action carrot-btn">🥕 Toss a carrot</button></div>
        <div class="sleep-picker"><label>Sleep time <span><b id="hours">3</b> hours</span></label><input id="sleepHours" type="range" min="1" max="8" value="3"></div>
      </div>
      <button id="reset" class="reset">← Choose a different pet</button>
    </aside>
  </section>
</main>
<script>
  const pets=[['cat','🐱'],['dog','🐶'],['bird','🐥'],['bunny','🐰'],['pixel','👾']];
  const palette={red:'#ff6363',green:'#66c96b',black:'#454352',pink:'#ff7eb5',blue:'#55bcea',yellow:'#ffd84f'};
  const chats={
    cat:['I found the warmest sunbeam! ☀️','If I fits, I sits! 📦','Can we chase a little red dot? 🔴','Purr... you make me feel cozy! 🧶','I dreamed about a mountain of yarn!','Did you know my whiskers help me explore?'],
    dog:['Can we play fetch? I will bring it back... maybe! 🎾','You are my favorite human in the whole world! 🐾','My tail goes wag-wag when I see you!','Want to go on a pretend adventure? 🗺️','I heard a tiny sound! I must investigate!','I give the very best puppy cuddles!'],
    bird:['Tweet-tweet! That means hello! 🎵','Let us sing a silly song together! 🎤','I can almost touch the clouds! ☁️','What is your favorite color feather?','I found the perfect little perch! 🌿','Today is a wonderful day to spread our wings!'],
    bunny:['Hop, hop, hooray! 🥕','Can we have a hopping race?','My ears heard you coming from far away! 👂','I would love a crunchy carrot picnic!','You make my nose wiggle with joy!','Let us look for flowers in the garden! 🌼'],
    pixel:['BEEP BOOP! Friendship level: MAX! 👾','I found a secret bonus level! 🎮','Loading cuddles... 100% complete!','My pixels sparkle when you visit! ✨','Achievement unlocked: Best Friends! 🏆','Want to do the robot dance? 🤖']
  };
  const happyChats=['I love spending time with you! 🌈','You are the best pet pal ever! ⭐','Can we play all day? 🎉','Today feels like a happy day!','Tell me something that made you smile! 😊','High five! We make a great team! ✋','I saved a giant cuddle just for you!','What game should we pretend to play?','You always know how to cheer me up! 💕','Let us make today extra sparkly! ✨'];
  const needChats={hunger:["My tummy is making rumbly sounds!","Could I have a tasty snack, please? 🍎","I am hungry enough to eat a giant carrot! 🥕"],clean:['I got a little muddy. Bath time?','Bubbles, please! I need a bath! 🫧','I want to be squeaky clean again! 🛁'],energy:['Yaaawn... my eyelids feel heavy.','Could I curl up for a little nap? 🌙','My battery feels low. Time to rest! 💤']};
  const facts={
    '🔢 Maths':['An even number can be shared into two equal whole-number groups.','A triangle always has three sides and three corners.','The number zero is neither positive nor negative.','Multiplication is a quick way of adding equal groups.','A googol is the number 1 followed by 100 zeros!','Every square is a rectangle, but not every rectangle is a square.','A prime number has exactly two factors: 1 and itself.','The angles inside a triangle add up to 180 degrees.','A fraction shows equal parts of a whole.','The equals sign means both sides have the same value.','The word hundred comes from an old Norse word meaning 120!','A circle has no straight sides and no corners.','Any number multiplied by zero equals zero.','A kilometre is equal to 1,000 metres.','The Roman numeral X means ten.','A cube has six square faces, twelve edges, and eight corners.','The digits in the decimal system are 0 through 9.','Half of one quarter is one eighth.','An acute angle is smaller than 90 degrees.','The Fibonacci sequence begins 0, 1, 1, 2, 3, 5, 8.'],
    '🔬 Science':['Octopuses have three hearts and blue blood!','Plants use sunlight to make their own food. This is called photosynthesis.','Sound travels as vibrations through air, water, and solids.','Your skeleton has 206 bones when you are an adult.','Water can be a solid, a liquid, or a gas.','The Sun is a star, and Earth takes one year to orbit it.','Light travels faster than sound, so lightning is seen before thunder is heard.','A group of stars forming a pattern is called a constellation.','Butterflies taste with sensors on their feet.','The human heart is a strong muscle that pumps blood around the body.','Gravity pulls objects towards one another.','Dolphins are mammals, so they breathe air with lungs.','A magnet has two poles called north and south.','The Moon does not make its own light; it reflects sunlight.','Bees tell one another where flowers are by performing a waggle dance.','Evaporation changes liquid water into water vapour.','The largest organ in the human body is the skin.','Some bamboo plants can grow nearly a metre in one day.','Mars is often called the Red Planet because of iron minerals in its soil.','A habitat is the natural home of a plant or animal.'],
    '🏺 History':['The ancient Egyptians used picture-writing called hieroglyphs.','The first modern Olympic Games took place in Greece in 1896.','People first walked on the Moon in 1969.','The Romans built long, straight roads across their empire.','The printing press helped books become easier to make and share.','Long ago, Vikings travelled in fast wooden longships.','The wheel was invented thousands of years ago in ancient Mesopotamia.','The ancient Greeks created plays that were comedies and tragedies.','The Great Fire of London began in a bakery in 1666.','The first powered aeroplane flight took place in 1903.','The Magna Carta was sealed in England in 1215.','The Maya built great cities in Central America.','Florence Nightingale helped improve hospitals and nursing.','The first postage stamp was called the Penny Black.','The Rosetta Stone helped scholars understand Egyptian hieroglyphs.','Ada Lovelace wrote an early computer algorithm in the 1800s.','The Iron Age was named after the metal used for many tools and weapons.','Ancient Roman towns often had public baths and marketplaces.','The first underground railway opened in London in 1863.','Mary Anning discovered important fossils along the English coast.'],
    '📚 English':['A noun names a person, place, thing, or idea.','A verb is an action or being word, like jump, think, or is.','A palindrome reads the same forwards and backwards, like level.','Similes compare things using like or as.','Every complete sentence begins with a capital letter.','Onomatopoeia means words that sound like their meaning, such as buzz!','An adjective describes a noun, as in fluffy rabbit.','A synonym is a word with a similar meaning to another word.','An antonym is a word with the opposite meaning to another word.','Alliteration repeats the same beginning sound, like busy buzzing bees.','A question usually ends with a question mark.','A pronoun can replace a noun, such as he, she, it, or they.','A prefix is added to the beginning of a word to change its meaning.','A suffix is added to the end of a word to change its meaning.','A metaphor says one thing is another to create a vivid picture.','The five vowels in English are A, E, I, O, and U.','A paragraph groups sentences that explore one main idea.','A haiku traditionally has three lines with 5, 7, and 5 syllables.','A homophone sounds like another word but has a different meaning, like sea and see.','Quotation marks show the exact words someone has spoken.'],
    '🌍 Geography':['Earth has seven continents and five oceans.','The Equator is an imaginary line around the middle of Earth.','The Pacific Ocean is the largest ocean on our planet.','A compass has four main directions: north, south, east, and west.','A river begins at its source and flows towards its mouth.','Antarctica is the coldest continent on Earth.','Mount Everest is the highest mountain above sea level.','The Sahara is the largest hot desert in the world.','A map key explains what the symbols on a map mean.','The Amazon carries more water than any other river.','An island is land completely surrounded by water.','Weather describes the atmosphere over a short time; climate describes usual patterns over many years.','The North Pole lies in the Arctic Ocean.','A volcano is an opening where material from inside Earth can reach the surface.','Lines of longitude run from the North Pole to the South Pole.','Africa is the continent with the most countries.','A peninsula is land almost surrounded by water.','A valley is low land between hills or mountains.','Japan is a country made up of thousands of islands.','A glacier is a huge, slow-moving mass of ice.'],
    '🎨 Art':['Red, yellow, and blue are traditional primary paint colors.','Mixing blue and yellow paint makes green.','A portrait is a picture of a person.','Artists use perspective to make flat pictures look deep.','Warm colors include reds, oranges, and yellows.','A sculpture is art that has height, width, and depth.','A landscape is artwork showing natural scenery.','Texture describes how something feels or looks like it would feel.','A collage is made by joining different materials onto a surface.','Complementary colors sit opposite each other on a color wheel.','A self-portrait is an artwork an artist makes of themselves.','Clay becomes hard and strong when fired in a very hot kiln.','A mosaic creates a picture from many small pieces.','Symmetrical art matches on both sides of a central line.','Watercolour paint is mixed with water to make transparent colors.','A sketch is often a quick, lightly drawn picture.','Vanishing points help artists draw realistic perspective.','Printmaking transfers an image from one surface onto another.','Abstract art can use colors and shapes without copying real objects.','Animation creates the illusion of movement from a sequence of images.']
  };
  let state={type:'cat',color:palette.pink,name:'Bubbles',hunger:72,clean:68,energy:80,lastChat:'',lastFact:''};
  const $=s=>document.querySelector(s);
  function petHTML(type){return `<div class="pet ${type}"><div class="tail"></div><i class="crest"></i><div class="head"><i class="ear l"></i><i class="ear r"></i><div class="face"><i class="spot"></i><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="muzzle"></i><i class="nose"></i><i class="mouth"></i><i class="tooth"></i><i class="whisker l"></i><i class="whisker r"></i></div></div><div class="body"></div><i class="wing l"></i><i class="wing r"></i><i class="paw l"></i><i class="paw r"></i></div>`}
  function drawPet(target){target.innerHTML=petHTML(state.type);target.querySelector('.pet').style.setProperty('--c',state.color)}
  pets.forEach(([name,icon])=>{const b=document.createElement('button');b.className='pet-choice'+(name==='cat'?' active':'');b.innerHTML=`<span class="emoji">${icon}</span>${name==='pixel'?'Pixel Pal':name[0].toUpperCase()+name.slice(1)}`;b.onclick=()=>{state.type=name;document.querySelectorAll('.pet-choice').forEach(x=>x.classList.toggle('active',x===b));drawPet($('#previewPet'))};$('#petChoices').append(b)});
  Object.entries(palette).forEach(([name,color])=>{const b=document.createElement('button');b.className='swatch'+(name==='pink'?' active':'');b.style.background=color;b.title=name;b.setAttribute('aria-label',name);b.onclick=()=>{state.color=color;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));drawPet($('#previewPet'))};$('#colors').append(b)});
  drawPet($('#previewPet'));
  function update(){[['hunger',state.hunger],['clean',state.clean],['energy',state.energy]].forEach(([id,n])=>{$(`#${id}Bar`).style.width=n+'%'});$('#titleName').textContent=state.name}
  function say(text){$('#speech').textContent=text;$('#speech').animate([{transform:'scale(.8)',opacity:.3},{transform:'scale(1)',opacity:1}],{duration:280});}
  function pickChat(list){let choices=list.filter(line=>line!==state.lastChat);let line=choices[Math.floor(Math.random()*choices.length)];state.lastChat=line;return line}
  function petChat(){
    let needs=[];
    if(state.hunger<45)needs.push(...needChats.hunger);
    if(state.clean<45)needs.push(...needChats.clean);
    if(state.energy<45)needs.push(...needChats.energy);
    if(needs.length&&Math.random()<.72)return pickChat(needs);
    return pickChat([...chats[state.type],...happyChats]);
  }
  function teach(){
    let choices=[];
    Object.entries(facts).forEach(([subject,items])=>items.forEach(fact=>choices.push({subject,fact})));
    choices=choices.filter(item=>item.fact!==state.lastFact);
    const lesson=choices[Math.floor(Math.random()*choices.length)];
    state.lastFact=lesson.fact;
    say(`${lesson.subject}: ${lesson.fact}`);
    sparkle('✨');
  }
  function sparkle(icon){for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent=icon;s.style.left=(25+Math.random()*55)+'%';s.style.top=(35+Math.random()*35)+'%';$('#room').append(s);setTimeout(()=>s.remove(),850)}}
  let catBusy=false;
  function walkCat(auto=false){
    if(state.type!=='cat'||catBusy||$('#game').classList.contains('hidden'))return;
    catBusy=true;
    const holder=$('#gamePet'),cat=holder.querySelector('.cat'),direction=Math.random()<.5?'left':'right';
    cat.classList.add('walking');holder.classList.add(`cat-walk-${direction}`);
    say(auto?'I think I will explore over here! 🐾':'Follow my tiny paw prints! 🐾');
    setTimeout(()=>{holder.classList.remove(`cat-walk-${direction}`);cat.classList.remove('walking');catBusy=false},3250);
  }
  function throwWool(){
    if(state.type!=='cat'||catBusy||$('#game').classList.contains('hidden'))return;
    catBusy=true;
    const room=$('#room'),holder=$('#gamePet'),cat=holder.querySelector('.cat'),direction=Math.random()<.5?'left':'right';
    const wool=document.createElement('div');wool.className=`wool throw-${direction}`;wool.setAttribute('role','img');wool.setAttribute('aria-label','Bouncing ball of wool');room.append(wool);
    cat.classList.add('playing','walking');holder.classList.add(`cat-chase-${direction}`);say('Wool! My favorite! I will catch it! 🧶');
    setTimeout(()=>{sparkle('💖');say('I caught it! Throw it again! 😸')},2050);
    setTimeout(()=>{wool.remove();holder.classList.remove(`cat-chase-${direction}`);cat.classList.remove('playing','walking');catBusy=false},3000);
  }
  let dogBusy=false;
  function walkDog(auto=false){
    if(state.type!=='dog'||dogBusy||$('#game').classList.contains('hidden'))return;
    dogBusy=true;
    const holder=$('#gamePet'),dog=holder.querySelector('.dog'),direction=Math.random()<.5?'left':'right';
    dog.classList.add('walking');holder.classList.add(`dog-walk-${direction}`);
    say(auto?'Sniff, sniff... I am going on a little patrol! 🐕':'Let us go for a wander! Follow me! 🐾');
    setTimeout(()=>{holder.classList.remove(`dog-walk-${direction}`);dog.classList.remove('walking');dogBusy=false},3250);
  }
  function throwStick(){
    if(state.type!=='dog'||dogBusy||$('#game').classList.contains('hidden'))return;
    dogBusy=true;
    const room=$('#room'),holder=$('#gamePet'),dog=holder.querySelector('.dog'),direction=Math.random()<.5?'left':'right';
    const stick=document.createElement('div');stick.className=`stick throw-${direction}`;stick.setAttribute('role','img');stick.setAttribute('aria-label','Flying wooden stick');room.append(stick);
    dog.classList.add('playing','walking');holder.classList.add(`dog-fetch-${direction}`);say('A stick! I am going to fetch it! 🐶');
    setTimeout(()=>say('Got it! I am bringing it back! 🪵'),2200);
    setTimeout(()=>{sparkle('⭐');say('Here you go! Throw it again! 🐾')},3750);
    setTimeout(()=>{stick.remove();holder.classList.remove(`dog-fetch-${direction}`);dog.classList.remove('playing','walking');dogBusy=false},4300);
  }
  const birdTreasures=[{icon:'🍃',name:'leaf'},{icon:'🔴',name:'little ball'},{icon:'🪶',name:'feather'},{icon:'🪵',name:'tiny stick'},{icon:'🫐',name:'berry'}];
  let birdBusy=false;
  function flyBird(auto=false){
    if(state.type!=='bird'||birdBusy||$('#game').classList.contains('hidden'))return;
    birdBusy=true;
    const holder=$('#gamePet'),bird=holder.querySelector('.bird'),direction=Math.random()<.5?'left':'right';
    bird.classList.add('flying');holder.classList.add(`bird-fly-${direction}`);
    say(auto?'Tweet! I feel like stretching my wings! 🪽':'Up, up, and away! Watch me fly! ☁️');
    setTimeout(()=>{holder.classList.remove(`bird-fly-${direction}`);bird.classList.remove('flying');birdBusy=false},4050);
  }
  function birdFetch(){
    if(state.type!=='bird'||birdBusy||$('#game').classList.contains('hidden'))return;
    birdBusy=true;
    const room=$('#room'),holder=$('#gamePet'),bird=holder.querySelector('.bird'),direction=Math.random()<.5?'left':'right';
    const treasure=birdTreasures[Math.floor(Math.random()*birdTreasures.length)],item=document.createElement('div');
    item.className=`bird-item throw-${direction}`;item.textContent=treasure.icon;item.setAttribute('role','img');item.setAttribute('aria-label',`Flying ${treasure.name}`);room.append(item);
    bird.classList.add('flying','fetching');holder.classList.add(`bird-fetch-${direction}`);say(`You threw a ${treasure.name}! I will swoop and fetch it! 🪽`);
    setTimeout(()=>say(`I found the ${treasure.name}! Bringing it back! ${treasure.icon}`),2600);
    setTimeout(()=>{sparkle('🌟');say(`Here is your ${treasure.name}! Shall we play again? 🎉`)},4300);
    setTimeout(()=>{item.remove();holder.classList.remove(`bird-fetch-${direction}`);bird.classList.remove('flying','fetching');birdBusy=false},4800);
  }
  let bunnyBusy=false;
  function hopBunny(auto=false){
    if(state.type!=='bunny'||bunnyBusy||$('#game').classList.contains('hidden'))return;
    bunnyBusy=true;
    const holder=$('#gamePet'),bunny=holder.querySelector('.bunny'),direction=Math.random()<.5?'left':'right';
    bunny.classList.add('hopping');holder.classList.add(`bunny-hop-${direction}`);
    say(auto?'My feet feel bouncy! Time for a little hop! 🐇':'Hop, hop, hooray! Watch me bounce! 🌼');
    setTimeout(()=>{holder.classList.remove(`bunny-hop-${direction}`);bunny.classList.remove('hopping');bunnyBusy=false},3450);
  }
  function throwCarrot(){
    if(state.type!=='bunny'||bunnyBusy||$('#game').classList.contains('hidden'))return;
    bunnyBusy=true;
    const room=$('#room'),holder=$('#gamePet'),bunny=holder.querySelector('.bunny'),direction=Math.random()<.5?'left':'right';
    const carrot=document.createElement('div');carrot.className=`carrot-item throw-${direction}`;carrot.textContent='🥕';carrot.setAttribute('role','img');carrot.setAttribute('aria-label','Flying carrot');room.append(carrot);
    bunny.classList.add('hopping','playing');holder.classList.add(`bunny-carrot-${direction}`);say('A crunchy carrot! I will hop and catch it! 🥕');
    setTimeout(()=>say('Nibble, nibble... I found it! 😋'),2300);
    setTimeout(()=>{sparkle('💚');say('That was delicious! Thank you! 🐰')},3400);
    setTimeout(()=>{carrot.remove();holder.classList.remove(`bunny-carrot-${direction}`);bunny.classList.remove('hopping','playing');bunnyBusy=false},4000);
  }
  $('#start').onclick=()=>{state.name=$('#petName').value.trim()||'Bubbles';$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');drawPet($('#gamePet'));$('#catControls').classList.toggle('hidden',state.type!=='cat');$('#dogControls').classList.toggle('hidden',state.type!=='dog');$('#birdControls').classList.toggle('hidden',state.type!=='bird');$('#bunnyControls').classList.toggle('hidden',state.type!=='bunny');update();say(`Hi, I'm ${state.name}! Let's be best friends! 💕`)};
  $('#walkCat').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();walkCat(false)});
  $('#throwWool').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();throwWool()});
  $('#walkDog').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();walkDog(false)});
  $('#throwStick').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();throwStick()});
  $('#flyBird').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();flyBird(false)});
  $('#birdFetch').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();birdFetch()});
  $('#hopBunny').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();hopBunny(false)});
  $('#throwCarrot').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();throwCarrot()});
  $('#sleepHours').oninput=e=>$('#hours').textContent=e.target.value;
  document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{
    const a=b.dataset.action;
    if(a==='feed'){state.hunger=Math.min(100,state.hunger+28);say('Yum yum! My tummy is happy! 😋');sparkle('🍓')}
    if(a==='bath'){state.clean=100;say('Splish, splash! I smell amazing! 🫧');sparkle('🫧')}
    if(a==='sleep'){const h=+$('#sleepHours').value;state.energy=Math.min(100,state.energy+h*12);$('#room').classList.add('night');say(`Night night! Wake me in ${h} hour${h>1?'s':''}. 💤`);setTimeout(()=>{$('#room').classList.remove('night');say("I'm awake and ready to play! ☀️")},1800);sparkle('⭐')}
    if(a==='chat')say(petChat())
    if(a==='teach')teach()
    update();
  });
  $('#reset').onclick=()=>{$('#game').classList.add('hidden');$('#setup').classList.remove('hidden')};
  setInterval(()=>{if($('#game').classList.contains('hidden'))return;state.hunger=Math.max(0,state.hunger-2);state.clean=Math.max(0,state.clean-1);state.energy=Math.max(0,state.energy-1);update();if(state.hunger===40)say("I'm hungry! Can I have a snack? 🥕");else if(state.clean===40)say('I need a bubbly bath! 🛁');else if(state.energy===40)say('Yawn... I need to sleep. 🌙')},5000);
  setInterval(()=>{if(state.type==='cat'&&!$('#game').classList.contains('hidden')&&Math.random()<.7)walkCat(true)},12000);
  setInterval(()=>{if(state.type==='dog'&&!$('#game').classList.contains('hidden')&&Math.random()<.7)walkDog(true)},12000);
  setInterval(()=>{if(state.type==='bird'&&!$('#game').classList.contains('hidden')&&Math.random()<.7)flyBird(true)},12000);
  setInterval(()=>{if(state.type==='bunny'&&!$('#game').classList.contains('hidden')&&Math.random()<.7)hopBunny(true)},12000);
</script>
</body>
</html>
